name: Database migrations

on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
      - "scripts/migrate.js"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
